name: Build Process Watcher reliability smoke

on:
  workflow_dispatch:
    inputs:
      note:
        description: Reliability prediction was retired from Build Process Watcher
        required: false
        default: retired
        type: string

permissions:
  contents: read

jobs:
  retired:
    name: Reliability prediction retired
    runs-on: ubuntu-latest
    steps:
      - name: Exit with retirement notice
        run: |
          echo "prediction_mode=reliability and predictive_reliability were removed from cdsap/build-process-watcher."
          echo "Use forecast / predict / bqml-boosted smokes instead."
          exit 1
