name: Build Process Watcher no-predict smoke
run-name: Collector comparison · ${{ inputs.experiment_ref }} · ${{ inputs.action_ref }}

on:
  workflow_dispatch:
    inputs:
      action_ref:
        description: Build Process Watcher ref (same action as predict smoke, prediction disabled)
        required: false
        default: main
        type: string
      backend_url:
        description: Public Build Process Watcher backend URL
        required: false
        default: https://build-process-watcher-backend-685615422311.us-central1.run.app
        type: string
      frontend_url:
        description: Public Build Process Watcher frontend base URL
        required: false
        default: https://process-watcher.web.app
        type: string
      experiment_ref:
        description: Experiment git ref used for run labeling
        required: false
        default: baseline
        type: choice
        options:
          - baseline
          - gradle-9.9.1
      interval:
        description: Monitor interval in seconds
        required: false
        default: '10'
        type: string
      gradle_task:
        description: Gradle task used as the monitored workload
        required: false
        default: :app:app:assembleDebug
        type: string

permissions:
  contents: read

concurrency:
  group: bpw-nopredict-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      workload_commit: ${{ steps.commits.outputs.workload }}
      action_commit: ${{ steps.commits.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.experiment_ref }}
          path: workload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cdsap/build-process-watcher
          ref: ${{ inputs.action_ref }}
          path: bpw-action
          persist-credentials: false
      - id: commits
        run: |
          echo "workload=$(git -C workload rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "action=$(git -C bpw-action rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        collector: [shell, daemonitor]
    env:
      DAEMONITOR_VERSION: '1.3.3'
    name: Gradle 9.9 · ${{ matrix.collector }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      bpw_run_id: ${{ steps.record.outputs.bpw_run_id }}
      backend_url: ${{ steps.record.outputs.backend_url }}
      frontend_url: ${{ steps.record.outputs.frontend_url }}

    steps:
      - name: Check out experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.workload_commit }}
          persist-credentials: false

      - name: Check out Build Process Watcher
        uses: actions/checkout@v4
        with:
          repository: cdsap/build-process-watcher
          ref: ${{ needs.resolve.outputs.action_commit }}
          path: bpw-action
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform for compileSdk 37
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Install Daemonitor CLI from Homebrew
        id: daemonitor
        if: matrix.collector == 'daemonitor'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cdsap/tap/daemonitor-cli
          installed=$(brew list --versions cdsap/tap/daemonitor-cli)
          if [[ "$installed" != "daemonitor-cli $DAEMONITOR_VERSION" ]]; then
            echo "Expected Daemonitor $DAEMONITOR_VERSION, installed: $installed" >&2
            exit 1
          fi
          bin_dir="$(brew --prefix cdsap/tap/daemonitor-cli)/bin"
          test -x "$bin_dir/daemonitor-cli"
          test -x "$bin_dir/daemonitor-cored"
          echo "bin_dir=$bin_dir" >> "$GITHUB_OUTPUT"

      - name: Prepare configured GC log directory
        run: mkdir -p /home/runner/work/Telltale/Telltale

      - name: Start live no-predict diagnostics
        id: watcher
        uses: ./bpw-action
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
          FRONTEND_URL: ${{ inputs.frontend_url }}
        with:
          collector: ${{ matrix.collector }}
          daemonitor_bin_dir: ${{ steps.daemonitor.outputs.bin_dir }}
          freshness_diagnostics: 'true'
          interval: ${{ inputs.interval }}
          debug: 'true'
          run_id: collectors-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.collector }}

      - name: Assert no-predict remote mode
        env:
          COLLECTOR: ${{ steps.watcher.outputs.collector }}
          EXPECTED_COLLECTOR: ${{ matrix.collector }}
          REMOTE: ${{ steps.watcher.outputs.remote_monitoring }}
          FRESHNESS: ${{ steps.watcher.outputs.freshness_diagnostics }}
          PREDICTION_MODE: ${{ steps.watcher.outputs.prediction_mode }}
          EXPORT_BQ: ${{ steps.watcher.outputs.export_to_bigquery }}
          RUN_ID: ${{ steps.watcher.outputs.run_id }}
          BACKEND_URL: ${{ steps.watcher.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.watcher.outputs.frontend_url }}
        run: |
          set -euo pipefail
          test "$COLLECTOR" = "$EXPECTED_COLLECTOR"
          test "$REMOTE" = "true"
          test "$FRESHNESS" = "true"
          test "${PREDICTION_MODE:-disabled}" = "disabled"
          test "$EXPORT_BQ" = "false"
          test -n "$RUN_ID"
          test -n "$BACKEND_URL"
          test -n "$FRONTEND_URL"
          echo "Freshness + prediction disabled confirmed for $RUN_ID"

      - name: Run Android assembleDebug
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
        run: ./gradlew "$GRADLE_TASK" --no-daemon --no-build-cache --stacktrace

      - name: Record Build Process Watcher run
        id: record
        if: always() && steps.watcher.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.watcher.outputs.run_id }}
          BACKEND_URL: ${{ steps.watcher.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.watcher.outputs.frontend_url }}
        run: |
          set -euo pipefail
          echo "bpw_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          mkdir -p nopredict-runs
          jq -n \
            --arg label "${{ inputs.experiment_ref }}" \
            --arg collector "${{ matrix.collector }}" \
            --arg action_commit "${{ needs.resolve.outputs.action_commit }}" \
            --arg workload_commit "${{ needs.resolve.outputs.workload_commit }}" \
            --arg run_id "$RUN_ID" \
            --arg backend_url "$BACKEND_URL" \
            --arg frontend_url "$FRONTEND_URL" \
            '{label: $label, collector: $collector, action_commit: $action_commit, workload_commit: $workload_commit, run_id: $run_id, backend_url: $backend_url, frontend_url: $frontend_url}' \
            > nopredict-runs/run.json

      - name: Upload Build Process Watcher run
        if: always() && steps.watcher.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: collector-run-${{ inputs.experiment_ref }}-${{ matrix.collector }}
          path: nopredict-runs/run.json
          if-no-files-found: error
          retention-days: 7
