name: Build Process Watcher tabpfn smoke

on:
  workflow_dispatch:
    inputs:
      action_ref:
        description: Build Process Watcher ref with prediction_mode=tabpfn support
        required: false
        default: main
        type: string
      backend_url:
        description: Public Build Process Watcher backend URL
        required: false
        default: https://build-process-watcher-backend-685615422311.us-central1.run.app
        type: string
      frontend_url:
        description: Public Build Process Watcher frontend base URL
        required: false
        default: https://process-watcher.web.app
        type: string
      experiment_ref:
        description: Experiment git ref used for run labeling
        required: false
        default: baseline
        type: choice
        options:
          - baseline
          - gradle-9.9.1
      interval:
        description: Monitor interval in seconds
        required: false
        default: '1'
        type: string
      prediction_target:
        description: Prediction target (class loading uses the separate experimental model)
        required: false
        default: memory
        type: choice
        options:
          - memory
          - class_loading
      prediction_throttle_s:
        description: Process-forecast cadence in elapsed seconds (default 20)
        required: false
        default: '20'
        type: string
      gradle_task:
        description: Gradle task used as the monitored workload
        required: false
        default: :app:app:assembleDebug
        type: string

permissions:
  contents: read

concurrency:
  group: bpw-tabpfn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Live tabpfn ${{ inputs.prediction_target }} ${{ inputs.experiment_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      bpw_run_id: ${{ steps.record.outputs.bpw_run_id }}
      backend_url: ${{ steps.record.outputs.backend_url }}
      frontend_url: ${{ steps.record.outputs.frontend_url }}

    steps:
      - name: Check out experiment
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.experiment_ref }}

      - name: Check out Build Process Watcher
        uses: actions/checkout@v4
        with:
          repository: cdsap/build-process-watcher
          ref: ${{ inputs.action_ref }}
          path: bpw-action

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform for compileSdk 37
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare configured GC log directory
        run: mkdir -p /home/runner/work/Telltale/Telltale

      - name: Start live tabpfn diagnostics
        id: watcher
        uses: ./bpw-action
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
          FRONTEND_URL: ${{ inputs.frontend_url }}
        with:
          freshness_diagnostics: 'true'
          prediction_mode: tabpfn
          prediction_target: ${{ inputs.prediction_target }}
          export_to_bigquery: 'false'
          prediction_throttle_s: ${{ inputs.prediction_throttle_s }}
          interval: ${{ inputs.interval }}
          debug: 'true'
          run_id: tabpfn-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.experiment_ref }}

      - name: Assert tabpfn remote mode
        env:
          REMOTE: ${{ steps.watcher.outputs.remote_monitoring }}
          FRESHNESS: ${{ steps.watcher.outputs.freshness_diagnostics }}
          PREDICTION_MODE: ${{ steps.watcher.outputs.prediction_mode }}
          PREDICTION_TARGET: ${{ steps.watcher.outputs.prediction_target }}
          REQUESTED_TARGET: ${{ inputs.prediction_target }}
          PREDICTION_THROTTLE_S: ${{ steps.watcher.outputs.prediction_throttle_s }}
          EXPORT_BQ: ${{ steps.watcher.outputs.export_to_bigquery }}
          RUN_ID: ${{ steps.watcher.outputs.run_id }}
          BACKEND_URL: ${{ steps.watcher.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.watcher.outputs.frontend_url }}
        run: |
          set -euo pipefail
          test "$REMOTE" = "true"
          test "$FRESHNESS" = "true"
          test "${PREDICTION_MODE:-disabled}" = "tabpfn"
          test "${PREDICTION_TARGET:-memory}" = "$REQUESTED_TARGET"
          test "${PREDICTION_THROTTLE_S:-}" = "${{ inputs.prediction_throttle_s }}"
          test "$EXPORT_BQ" = "false"
          test -n "$RUN_ID"
          test -n "$BACKEND_URL"
          test -n "$FRONTEND_URL"
          echo "Freshness + tabpfn mode confirmed for $RUN_ID"

      - name: Run Android assembleDebug
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
        run: ./gradlew "$GRADLE_TASK" --no-daemon --no-build-cache --stacktrace

      - name: Record Build Process Watcher run
        id: record
        if: always() && steps.watcher.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.watcher.outputs.run_id }}
          BACKEND_URL: ${{ steps.watcher.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.watcher.outputs.frontend_url }}
        run: |
          set -euo pipefail
          echo "bpw_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          mkdir -p tabpfn-runs
          jq -n \
            --arg label "${{ inputs.experiment_ref }}" \
            --arg run_id "$RUN_ID" \
            --arg backend_url "$BACKEND_URL" \
            --arg frontend_url "$FRONTEND_URL" \
            '{label: $label, run_id: $run_id, backend_url: $backend_url, frontend_url: $frontend_url}' \
            > tabpfn-runs/run.json

      - name: Upload Build Process Watcher run
        if: always() && steps.watcher.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: tabpfn-run-${{ inputs.experiment_ref }}
          path: tabpfn-runs/run.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify live tabpfn issuances
    if: always() && needs.build.outputs.bpw_run_id != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify requested backend forecast target
        env:
          BPW_RUN_ID: ${{ needs.build.outputs.bpw_run_id }}
          PREDICTION_TARGET: ${{ inputs.prediction_target }}
          BACKEND_URL: ${{ needs.build.outputs.backend_url }}
          FRONTEND_URL: ${{ needs.build.outputs.frontend_url }}
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/tabpfn-run.json"
          verified=false

          for attempt in {1..36}; do
            if curl --fail --silent --show-error "$BACKEND_URL/runs/$BPW_RUN_ID" > "$run_json"; then
              if jq --arg target "$PREDICTION_TARGET" -e '
                .finished == true
                and (.samples | type == "array" and length > 0)
                and ((.prediction_checkpoints // []) | length == 0)
                and (.prediction_mode // "disabled") == "tabpfn"
                and (.prediction_target // "memory") == $target
                and (if $target == "class_loading" then
                  ((.process_forecasts // []) | length == 0)
                  and ([.process_activity_forecasts[]? | select(.status == "ready")] | length > 0)
                  and all(.process_activity_forecasts[]? | select(.status == "ready");
                    . as $f
                    | ($f.process_name == "GradleDaemon" or $f.process_name == "KotlinCompileDaemon")
                    and ($f.pid | type == "string" and length > 0)
                    and $f.metric == "classes_loaded"
                    and $f.method == "tabpfn"
                    and (($f.fallback // false) == false)
                    and ($f.model_version | type == "string" and length > 0)
                    and ($f.created_at_ms | type == "number")
                    and ($f.origin_value_count | type == "number")
                    and (($f.points // []) | length == 1)
                    and all($f.points[];
                      .target_at_ms == ($f.created_at_ms + 60000)
                      and (.predicted_delta_count | type == "number")
                      and .predicted_delta_count >= 0
                      and (.predicted_total_count | type == "number")
                      and ((.predicted_total_count - $f.origin_value_count - .predicted_delta_count) | fabs) < 0.000001
                    )
                  )
                else
                  ((.process_activity_forecasts // []) | length == 0)
                  and ((.process_forecasts // []) | length > 0)
                  and ([.process_forecasts[]? | select(.method == "tabpfn" and ((.fallback // false) == false))] | length > 0)
                and ([.process_forecasts[] | . as $f | select(
                  ($f.process_name | type == "string")
                  and ($f.pid | type == "string")
                  and ($f.metric == "heap" or $f.metric == "rss")
                  and ($f.created_at_ms | type == "number")
                  and (($f.points // []) | length > 0)
                  and all($f.points[];
                    (.target_at_ms | type == "number")
                    and (.value_mb | type == "number")
                    and (.target_at_ms >= $f.created_at_ms)
                  )
                )] | length) == (.process_forecasts | length)
                end)
              ' "$run_json" > /dev/null; then
                verified=true
                break
              fi
            fi
            echo "Waiting for finalized tabpfn issuances (${attempt}/36)."
            sleep 10
          done

          if [ "$verified" != true ]; then
            echo "No finalized $PREDICTION_TARGET model forecasts for $BPW_RUN_ID."
            jq '{
              finished,
              sample_count: (.samples | length),
              prediction_checkpoints: (.prediction_checkpoints // [] | length),
              process_forecasts: [.process_forecasts[]? | {process_name, pid, metric, created_at_ms, points: (.points|length)}],
              process_activity_forecasts: [.process_activity_forecasts[]? | {process_name, pid, status, method, model_version}]
            }' "$run_json" || true
            exit 1
          fi

          summary="$(jq --arg target "$PREDICTION_TARGET" -c '
            (if $target == "class_loading" then [.process_activity_forecasts[]? | select(.status == "ready")] else [.process_forecasts[]? | select(.method == "tabpfn" and ((.fallback // false) == false))] end) as $forecasts |
            {
            finished,
            sample_count: (.samples | length),
            prediction_target: $target,
            forecast_count: ($forecasts | length),
            metrics: [$forecasts[] | .metric] | unique,
            processes: [$forecasts[] | .process_name] | unique,
            checkpoints: (.prediction_checkpoints // [] | length),
            methods: [$forecasts[] | .method // "unknown"] | unique,
            models: [$forecasts[] | .model_version // "unknown"] | unique
          }' "$run_json")"
          echo "TabPFN summary: $summary"

          dashboard_url="${FRONTEND_URL%/}/runs/$BPW_RUN_ID"
          echo "## tabpfn smoke"
          echo "- Run: [$BPW_RUN_ID]($dashboard_url)"
          echo "- Prediction target: $PREDICTION_TARGET"
          echo "- tabpfn issuances: $(jq -r '.forecast_count' <<<"$summary")"
          echo "- Processes: $(jq -r '.processes | join(", ")' <<<"$summary")"
          echo "- Metrics: $(jq -r '.metrics | join(", ")' <<<"$summary")"
          echo "- Methods: $(jq -r '.methods | join(", ")' <<<"$summary")"
          echo "- Models: $(jq -r '.models | join(", ")' <<<"$summary")"
          echo "- Reliability checkpoints: $(jq -r '.checkpoints' <<<"$summary") (expect 0)"
